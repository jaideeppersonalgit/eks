
apiVersion: apps/v1
kind: Deployment

metadata:
  name: eks-demo
  labels:
    app: eks-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: eks-demo

  template:
    metadata:
      labels:
        app: eks-demo

    spec:
      containers:
        - name: nginx
          image: ${IMAGE_URI}
          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 128Mi

---
apiVersion: v1
kind: Service

metadata:
  name: eks-demo-service

spec:
  type: ClusterIP

  selector:
    app: eks-demo

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
