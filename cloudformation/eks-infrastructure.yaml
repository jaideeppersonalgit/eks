
AWSTemplateFormatVersion: '2010-09-09'
Description: EKS Lab Infrastructure with VPC, IAM, EKS, EC2 Node Group and ECR

Parameters:
  ClusterName:
    Type: String
    Default: eks-lab

  AdminCidr:
    Type: String
    Description: Your public IP in CIDR format, for example 203.0.113.10/32
    AllowedPattern: '^[0-9.]+/[0-9]+$'

  NodeInstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small
      - t3.medium

Resources:

  # -------------------------------
  # VPC
  # -------------------------------

  EksVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: eks-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: eks-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref EksVPC
      InternetGatewayId: !Ref InternetGateway

  # -------------------------------
  # Public Subnets
  # -------------------------------

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EksVPC
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: eks-public-subnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EksVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: eks-public-subnet-2

  # -------------------------------
  # Route Table
  # -------------------------------

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref EksVPC

  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  Subnet1RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  Subnet2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # -------------------------------
  # EKS Cluster IAM Role
  # -------------------------------

  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  # -------------------------------
  # Worker Node IAM Role
  # -------------------------------

  EksNodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  # -------------------------------
  # EKS Cluster
  # -------------------------------

  EksCluster:
    Type: AWS::EKS::Cluster
    DependsOn:
      - AttachGateway
      - Subnet1RouteAssociation
      - Subnet2RouteAssociation
    Properties:
      Name: !Ref ClusterName
      RoleArn: !GetAtt EksClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PublicSubnet1
          - !Ref PublicSubnet2
        EndpointPublicAccess: true
        EndpointPrivateAccess: false
        PublicAccessCidrs:
          - !Ref AdminCidr

  # -------------------------------
  # Managed Node Group
  # -------------------------------

  EksNodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref EksCluster
      NodegroupName: eks-managed-nodes
      NodeRole: !GetAtt EksNodeRole.Arn
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      InstanceTypes:
        - !Ref NodeInstanceType
      AmiType: AL2023_x86_64_STANDARD
      DiskSize: 20
      CapacityType: ON_DEMAND
      ScalingConfig:
        MinSize: 1
        DesiredSize: 1
        MaxSize: 2
      UpdateConfig:
        MaxUnavailable: 1

  # -------------------------------
  # ECR Repository
  # -------------------------------

  AppRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: eks-demo
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

Outputs:

  ClusterName:
    Description: EKS Cluster Name
    Value: !Ref EksCluster

  VpcId:
    Description: VPC ID
    Value: !Ref EksVPC

  Subnet1:
    Value: !Ref PublicSubnet1

  Subnet2:
    Value: !Ref PublicSubnet2

  EcrRepositoryUri:
    Description: ECR Repository URI
    Value: !GetAtt AppRepository.RepositoryUri

  NodeGroupName:
    Value: !Ref EksNodeGroup
